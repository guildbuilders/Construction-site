  <meta name="description" content="Pick a time for your free in-home estimate and design consultation with Omer. San Diego County kitchen and bathroom remodeling." />
  <link rel="canonical" href="https://guildbuildersgroup.com/book" />

  <link rel="preload" href="fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin />

<body class="lp-book-page">

  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://edge.guildbuildersgroup.com/ns.html?id=GTM-P526Z2L9"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <header class="lp-header">
    <div class="lp-container lp-header-inner">
      <a class="lp-logo lp-logo-home" href="/"><img src="guild-logo-reg.png" alt="Guild Builders Inc. logo" /></a>
      <a class="lp-header-phone" href="tel:+16197632982">
        <span class="tel">(619) 763-2982</span>
      </a>
    </div>
  </header>

  <main class="lp-book">
    <div class="lp-container">
      <p class="eyebrow">Free Estimate &amp; Design Consultation</p>
      <h1>Pick a time that works for you</h1>

      <!-- The scheduler is embedded rather than linked out to. Two reasons, and
           the second is the one that pays for itself: the visitor never leaves
           guildbuildersgroup.com mid-conversion, and the booking therefore
           completes on our own domain, where the _gcl_aw cookie holding the
           Google click id still lives. A booking taken on cal.com would be a
           conversion Google often could not tie back to the ad click that
           produced it. -->
      <div id="cal-embed" class="lp-book-embed"></div>

      <noscript>
        <p class="lp-book-fallback">The booking calendar needs JavaScript. Call
          <a href="tel:+16197632982">(619) 763-2982</a> and we will find a time.</p>
      </noscript>
    </div>
  </main>

  <footer class="lp-footer">
    <div class="lp-container">
      <p><strong>Guild Builders Inc.</strong> · Licensed Contractor CA #1154614 · Serving San Diego County</p>
      <p>© 2026 Guild Builders Inc. All rights reserved.</p>
    </div>
  </footer>

  <div class="lp-sticky-call">
    <a class="call" href="tel:+16197632982">📞 (619) 763-2982</a>
  </div>

  <script src="tracking.js?v=5"></script>

  <!-- Cal.com embed loader, their snippet, unmodified. -->
  <script>
    (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if (typeof namespace === "string") { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]); } else p(cal, ar); return; } p(cal, ar); }; })(window, "https://app.cal.com/embed/embed.js", "init");

    Cal("init", "estimate", { origin: "https://app.cal.com" });

    Cal.ns.estimate("inline", {
      elementOrSelector: "#cal-embed",
      config: { layout: "month_view" },
      calLink: "guildbuilders/estimate"
    });

    Cal.ns.estimate("ui", { hideEventTypeDetails: false, layout: "month_view" });

    /* A completed booking. gb_bookingConfirmed is defined in tracking.js: it
       stashes what the embed hands us and sends the visitor to the confirmation
       page, which pushes booking_confirmed once the page has fully loaded.
       Pushing here instead would race the redirect, the same problem the lead
       forms have. */
    Cal.ns.estimate("on", {
      action: "bookingSuccessful",
      callback: function (e) {
        try {
          window.gb_bookingConfirmed(e && e.detail && e.detail.data);
        } catch (err) {
          /* Never let a tracking failure strand someone who just booked. */
          window.location.href = "/booking-confirmed";
        }
      }
    });
  </script>

</body>
</html>
